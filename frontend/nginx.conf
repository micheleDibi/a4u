server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Limite upload: avatar (immagini) e materiali corso (PDF/DOCX/RTF/TXT).
  # Deve essere >= max(UPLOAD_MAX_MB, AVATAR_AUDIO_MAX_MB) del backend
  # — il backend di default usa 5 MB / 10 MB. Margin generoso.
  client_max_body_size 25m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # microphone/camera abilitati per la STESSA origine: servono per la
  # registrazione del campione vocale (e futura webcam) nella creazione
  # dell'avatar personale. Chrome applica rigidamente Permissions-Policy:
  # con `microphone=()` getUserMedia veniva bloccato solo su Chrome.
  add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;
  # Content-Security-Policy con il SOLO `img-src` (SEC-1). È il browser di
  # chi guarda ad applicare la politica del documento, e la pagina servita
  # da qui non ne aveva nessuna: le risposte del backend hanno la loro
  # (`app/middleware/security_headers.py`), ma la pagina dell'applicazione
  # è questa. Serve perché `mermaid.render` attacca l'SVG al documento per
  # misurarlo PRIMA che `sanitizeMermaidSvg` possa toglierne un
  # `<image href="http://…">`: la richiesta parte lì e nessuna
  # sanificazione arriva in tempo.
  # Nessun `default-src`: script, stili, font, connessioni e media restano
  # come sono — il raggio d'azione è solo le immagini.
  # `__A4U_UPLOADS_ORIGIN__` è sostituito a build time dal Dockerfile con
  # l'origine di `VITE_UPLOADS_BASE_URL` (stringa vuota se gli upload sono
  # sulla stessa origine, cioè il default `/uploads` proxato qui sotto):
  # è la stessa variabile che decide da dove il frontend carica le
  # immagini, quindi le due cose non possono divergere.
  add_header Content-Security-Policy "img-src 'self' data: blob:__A4U_UPLOADS_ORIGIN__" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/wasm image/svg+xml;
  gzip_min_length 256;
}
