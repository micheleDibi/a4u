server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Limite upload: avatar (immagini) e materiali corso (PDF/DOCX/RTF/TXT).
  # Deve essere >= max(UPLOAD_MAX_MB, AVATAR_AUDIO_MAX_MB) del backend
  # — il backend di default usa 5 MB / 10 MB. Margin generoso.
  client_max_body_size 25m;

  # ATTENZIONE (Fase D, giro 8): nginx eredita gli `add_header` del livello
  # superiore SOLO se il livello corrente non ne ha nessuno. Basta UN
  # `add_header` dentro un `location` per cancellare lì tutti e cinque
  # questi header, la Content-Security-Policy compresa (misurato su
  # nginx 1.27.5). Chi deve aggiungere un header a un `location` ripeta lì
  # anche questi cinque; `test_frontend_csp_header.py` pinna l'invariante.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # microphone/camera abilitati per la STESSA origine: servono per la
  # registrazione del campione vocale (e futura webcam) nella creazione
  # dell'avatar personale. Chrome applica rigidamente Permissions-Policy:
  # con `microphone=()` getUserMedia veniva bloccato solo su Chrome.
  add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;
  # Content-Security-Policy con il SOLO `img-src` (SEC-1). È il browser di
  # chi guarda ad applicare la politica del documento, e la pagina servita
  # da qui non ne aveva nessuna: le risposte del backend hanno la loro
  # (`app/middleware/security_headers.py`), ma la pagina dell'applicazione
  # è questa. Serve perché `mermaid.render` attacca l'SVG al documento per
  # misurarlo PRIMA che `sanitizeMermaidSvg` possa toglierne un
  # `<image href="http://…">`: la richiesta parte lì e nessuna
  # sanificazione arriva in tempo.
  # Nessun `default-src`: script, stili, font, connessioni e media restano
  # come sono — il raggio d'azione è solo le immagini.
  # `__A4U_UPLOADS_ORIGIN__` è sostituito a build time dal Dockerfile con
  # l'origine di `VITE_UPLOADS_BASE_URL` (stringa vuota se gli upload sono
  # sulla stessa origine, cioè il default `/uploads` proxato qui sotto): è
  # la stessa variabile che decide da dove il frontend carica le immagini
  # (`src/lib/media.ts`). Le due letture non sono però la stessa funzione —
  # il `case` della shell è sensibile alle maiuscole e agli spazi, la regex
  # di `media.ts` no — perciò dal giro 8 il Dockerfile normalizza il valore
  # (spazi ai bordi tolti, schema e host in minuscolo) e fa fallire il
  # build su una riga generata malformata: senza quella normalizzazione un
  # `HTTPS://…` o uno spazio iniziale svuotava l'origine qui e la lasciava
  # attiva in `media.ts`, cioè le immagini caricate sparivano in silenzio.
  add_header Content-Security-Policy "img-src 'self' data: blob:__A4U_UPLOADS_ORIGIN__" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Asset di Vite con l'hash del contenuto nel nome: un nome nuovo a ogni
  # build, quindi si possono tenere in cache un anno. `expires` scrive
  # `Expires` e `Cache-Control: max-age` SENZA `add_header`, perciò i cinque
  # header del `server` qui sopra continuano a essere ereditati. `=404`
  # invece del fallback su `/index.html`: un asset di un build vecchio che
  # manca non deve tornare come pagina HTML messa in cache per un anno.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # La pagina punta agli asset del build corrente: va sempre rivalidata
  # (`expires -1` → `Cache-Control: no-cache`), altrimenti dopo un deploy il
  # browser terrebbe l'HTML vecchio con i nomi di asset che non esistono più.
  # Ci arrivano anche `/` (direttiva `index`) e il fallback della SPA qui
  # sotto, che sono redirect interni verso `/index.html`.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;
  }

  gzip on;
  # Livello 5: quasi tutta la compressione del 9 a una frazione della CPU
  # (il default 1 lasciava il bundle JS molto più grande in rete).
  gzip_comp_level 5;
  # `Vary: Accept-Encoding`, così una cache intermedia non serve la versione
  # compressa a chi non la accetta.
  gzip_vary on;
  # Comprime anche le risposte richieste attraverso un proxy (CDN, bilanciatore).
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/wasm image/svg+xml;
  gzip_min_length 256;
}
